# HTTP: serve the ACME challenge, redirect everything else to the canonical HTTPS
# host. Fixed hostname (NOT $host) so bare-IP/old-host visitors land on the name
# the TLS certificate covers — otherwise the browser shows a cert-name mismatch.
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://mbfx.visionitinfra.com$request_uri;
    }
}

# HTTPS — canonical domain (serves the app)
server {
    listen 443 ssl default_server;
    server_name mbfx.visionitinfra.com;

    ssl_certificate     /etc/letsencrypt/live/mbfx.visionitinfra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mbfx.visionitinfra.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # SPA-friendly CSP. Tighten as needed; 'unsafe-inline' covers runtime inline styles.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    client_max_body_size 10m;
}

# Old nip.io hostname → redirect to the canonical domain (keeps its own valid cert
# so old bookmarks get a clean handshake before the 301).
server {
    listen 443 ssl;
    server_name 200-141-1-176.nip.io;

    ssl_certificate     /etc/letsencrypt/live/200-141-1-176.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/200-141-1-176.nip.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 301 https://mbfx.visionitinfra.com$request_uri;
}

# Bare IP over HTTPS → redirect. The browser validates the cert during the TLS
# handshake first, so https://<ip> still warns — use the domain name.
server {
    listen 443 ssl;
    server_name 200.141.1.176;

    ssl_certificate     /etc/letsencrypt/live/mbfx.visionitinfra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mbfx.visionitinfra.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 301 https://mbfx.visionitinfra.com$request_uri;
}
