name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API (typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @tcp/api exec prisma generate
      - name: Typecheck
        run: pnpm --filter @tcp/api exec tsc --noEmit -p tsconfig.json
      - name: Test
        run: pnpm --filter @tcp/api exec jest --ci
      - name: Build
        run: pnpm --filter @tcp/api exec nest build

  web:
    name: Web (typecheck · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @tcp/web exec tsc --noEmit -p tsconfig.json
      - name: Build
        run: pnpm --filter @tcp/web exec vite build
